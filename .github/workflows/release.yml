name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing source tag to release (for example v0.1.0)'
        required: true
        type: string
      publish_release:
        description: 'Publish GitHub releases after signing (disable for a test artifact only)'
        default: true
        type: boolean

permissions:
  contents: read
concurrency:
  group: quietweibo-release
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'fengwenhua/quietweibo' && github.actor == 'fengwenhua' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate committed tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3 scripts/github-release.py preflight --tag "$RELEASE_TAG"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - name: Android SDK 37
        run: bash scripts/setup-android.sh
      - name: Verify Gradle Wrapper pins
        run: python3 scripts/check-wrapper.py

      - name: Test, lint and build unsigned release
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleRelease

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-release
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

  sign:
    needs: build
    environment: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: unsigned-release
          path: unsigned
      - name: Sign APK and update manifest
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          UPDATE_SIGNING_KEY_PEM: ${{ secrets.UPDATE_SIGNING_KEY_PEM }}
        run: |
          build_tools=$(ls -1d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          python3 scripts/sign-release.py \
            --apk unsigned/app-release-unsigned.apk \
            --build-tools "$build_tools"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-release
          path: dist/*
          if-no-files-found: error

  publish:
    if: inputs.publish_release
    needs: sign
    environment: release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: signed-release
          path: dist
      - name: Publish verified main Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3 scripts/github-release.py publish --tag "$RELEASE_TAG"
      - name: Synchronize Xposed-Modules-Repo when a scoped credential is available
        env:
          GITHUB_TOKEN: ${{ secrets.MODULE_REPO_TOKEN }}
        run: |
          if [ -z "$GITHUB_TOKEN" ]; then
            echo 'MODULE_REPO_TOKEN not configured; publish the same signed-release artifact to the module repository via the documented fallback.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          module_tag=$(python3 -c 'import pathlib; v=dict(l.split("=",1) for l in pathlib.Path("version.properties").read_text().splitlines() if "=" in l); print(v["versionCode"]+"-"+v["versionName"])')
          python3 scripts/github-release.py publish \
            --repo Xposed-Modules-Repo/io.github.fengwenhua.quietweibo \
            --tag "$module_tag" --dist dist
